<body><div class="app">

</main><button id="fab" class="fab" onclick="add()">＋</button><nav class="nav"><div class="navin"><button data-s="home" class="on" onclick="show('home')"><i>⌂</i>首頁</button><button data-s="inventory" onclick="show('inventory')"><i>▦</i>物資</button><button data-s="alerts" onclick="show('alerts')"><i>◷</i>提醒</button><button data-s="settings" onclick="show('settings')"><i>⚙</i>設定</button></div></nav></div>
<div id="modal" class="modal"><div class="sheet"><div class="handle"></div><h2 id="mt">新增物資</h2><input id="id" type="hidden"><div class="two"><div class="row"><label>物資名稱</label><input id="name" placeholder="例如：瓶裝水"></div><div class="row"><label>類別</label><select id="type"><option>工具</option><option>耗材</option><option>醫療</option><option>食物</option><option>其他</option></select></div></div><div class="two"><div class="row"><label>存放位置</label><select id="place"></select></div><div class="row"><label>數量</label><div class="counter"><button onclick="change(-1)">−</button><strong id="number">1</strong><button onclick="change(1)">＋</button></div></div></div><div class="row"><label>有效期限</label><input id="date" type="date"></div><div class="row"><label>備註</label><textarea id="note" placeholder="品牌、規格、放置細節……"></textarea></div><div class="actions"><button class="btn" onclick="closeM()">取消</button><button class="btn primary" onclick="save()">儲存</button></div></div></div>

<div id="buyModal" class="modal"><div class="sheet"><div class="handle"></div><h2>加入待買清單</h2><div class="row"><label>品項</label><input id="buyName" placeholder="例如：飲用水"></div><div class="two"><div class="row"><label>數量</label><input id="buyQty" type="number" min="1" value="1"></div><div class="row"><label>想購買品牌</label><input id="buyBrand" placeholder="可不填"></div></div><div class="actions"><button class="btn" onclick="closeBuy()">取消</button><button class="btn primary" onclick="saveBuy()">加入待買</button></div></div></div><div id="toast" class="toast"></div>
<script>
const KEY='disaster-supplies-v5',OLD='disaster-supplies-v4';let db=JSON.parse(localStorage.getItem(KEY)||localStorage.getItem(OLD)||'{"title":"防災物資","locations":["總物資"],"items":[],"buys":[]}');db.locations=db.locations?.length?db.locations:['總物資'];db.items=db.items||[];db.buys=db.buys||[];let loc=db.locations[0],n=1;
const RECS=[['飲用水','食物','2瓶／每瓶600ml'],['不用煮的主食','食物','罐頭、即食飯、口糧餅乾'],['能量點心','食物','營養棒、果乾、堅果'],['口罩','耗材',''],['衛生紙','耗材',''],['消毒濕紙巾／酒精','耗材',''],['基本急救用品','醫療','外傷藥膏、紗布等'],['常用藥物','醫療','依個人需求'],['體溫計','醫療',''],['手電筒／頭燈','工具','含電池'],['哨子','工具',''],['可攜式收音機','工具',''],['雨衣與外套','其他',''],['保暖毯','其他',''],['少量現金','其他',''],['乾電池','工具',''],['充電線','工具',''],['行動電源','工具','充飽'],['工作手套','工具',''],['塑膠袋','耗材',''],['紙筆','耗材','']];
function esc(s){return String(s??'').replace(/[&<>\\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[c]))}function days(d){return d?Math.ceil((new Date(d+'T23:59:59')-new Date())/864e5):99999}function ico(c){return{工具:'🛠️',耗材:'🧻',醫療:'🩹',食物:'🥫',其他:'📦'}[c]||'📦'}function persist(){localStorage.setItem(KEY,JSON.stringify(db));render()}function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('active',x.id===id));document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('on',x.dataset.s===id));document.getElementById('fab').style.display=id==='home'||id==='inventory'?'block':'none';render()}function locs(id){document.getElementById(id).innerHTML=db.locations.map(x=>`<button class="pill ${x===loc?'active':''}" onclick="loc='${esc(x)}';render()">${esc(x)}</button>`).join('')+'<button class="addloc" onclick="openLoc()">＋</button>'}function item(i){let d=days(i.date),b=i.date?(d<0?'<span class="badge red">已過期</span>':d<=60?`<span class="badge">${d===0?'今天':d+'天後'}</span>`:''):'';return`<div class="item" onclick="edit('${i.id}')"><div class="icon">${ico(i.type)}</div><div class="main"><div class="name">${esc(i.name)} ${b}</div><div class="meta">${esc(i.type)} · ${esc(i.location)}${i.date?' · '+esc(i.date):''}</div></div><div class="qty">${i.qty}</div></div>`}function same(a,b){let x=a.replace(/[\s／/、·]/g,'').toLowerCase(),y=b.replace(/[\s／/、·]/g,'').toLowerCase();return x.includes(y)||y.includes(x)}
function render(){document.getElementById('title').textContent=db.title||'防災物資';locs('loc1');locs('loc2');document.getElementById('place').innerHTML=db.locations.map(x=>`<option>${esc(x)}</option>`).join('');let q=(document.getElementById('search')?.value||'').toLowerCase(),c=document.getElementById('cat')?.value||'全部',arr=db.items.filter(i=>i.location===loc&&(c==='全部'||i.type===c)&&(!q||i.name.toLowerCase().includes(q)));document.getElementById('list').innerHTML=arr.length?arr.map(item).join(''):'<div class="empty">📦<br>目前沒有符合的物資</div>';let home=db.items.filter(i=>i.location===loc),soon=db.items.filter(i=>days(i.date)<=60&&i.date).sort((a,b)=>days(a.date)-days(b.date));document.getElementById('cnt').textContent=home.length;document.getElementById('sum').textContent=home.reduce((a,i)=>a+i.qty,0);document.getElementById('exp').textContent=soon.length;document.getElementById('reminders').innerHTML=soon.length?soon.slice(0,8).map(i=>`<div class="rowline"><b>${esc(i.name)}</b><span class="date">${esc(i.date)}</span></div>`).join(''):'<div class="empty">目前沒有到期提醒</div>';let lows=db.items.filter(i=>i.qty<=1),ex=db.items.filter(i=>days(i.date)<=60&&i.date);document.getElementById('alertList').innerHTML=lows.length||ex.length?`<div class="notice">數量偏低 ${lows.length} 項　｜　60天內到期 ${ex.length} 項</div>${[...new Map([...lows,...ex].map(i=>[i.id,i])).values()].map(item).join('')}`:'<div class="empty">目前沒有需要處理的提醒</div>';document.getElementById('buys').innerHTML=db.buys.length?db.buys.slice(0,8).map(b=>`<div class="buyrow"><b>${esc(b.name)}</b><span>×${b.qty}</span><span class="buybrand">${esc(b.brand||'未指定品牌')}</span><span></span></div>`).join(''):'<div class="empty">目前沒有待買品項</div>';document.getElementById('allBuys').innerHTML=db.buys.length?db.buys.map((b,k)=>`<div class="buyrow"><b>${esc(b.name)}</b><span>×${b.qty}</span><span class="buybrand">${esc(b.brand||'未指定品牌')}</span><button class="small" onclick="removeBuy(${k})">完成</button></div>`).join(''):'<div class="empty">待買清單是空的</div>';let miss=RECS.filter(r=>!db.items.some(i=>same(i.name,r[0]))&&!db.buys.some(b=>same(b.name,r[0])));document.getElementById('recommendList').innerHTML=miss.length?miss.map(r=>`<div class="recommend"><div class="recmain"><div class="recname">${esc(r[0])}</div><div class="recmeta">${esc(r[1])}${r[2]?' · '+esc(r[2]):''}</div></div><button class="buy" onclick="quickBuy('${esc(r[0])}')">加入待買</button></div>`).join(''):'<div class="empty">✓ 建議品項都已準備或列入待買</div>'}
function add(){document.getElementById('mt').textContent='新增物資';document.getElementById('id').value='';document.getElementById('name').value='';document.getElementById('type').value='其他';document.getElementById('place').value=loc;document.getElementById('date').value='';document.getElementById('note').value='';n=1;document.getElementById('number').textContent=n;document.getElementById('modal').classList.add('show')}function edit(id){let i=db.items.find(x=>x.id===id);if(!i)return;document.getElementById('mt').textContent='編輯物資';document.getElementById('id').value=id;document.getElementById('name').value=i.name;document.getElementById('type').value=i.type;document.getElementById('place').value=i.location;document.getElementById('date').value=i.date||'';document.getElementById('note').value=i.note||'';n=i.qty;document.getElementById('number').textContent=n;document.getElementById('modal').classList.add('show')}function closeM(){document.getElementById('modal').classList.remove('show')}function change(x){n=Math.max(0,Math.min(999,n+x));document.getElementById('number').textContent=n}function save(){let name=document.getElementById('name').value.trim();if(!name)return toast('請輸入物資名稱');let id=document.getElementById('id').value,i={id:id||Date.now().toString(36),name,type:document.getElementById('type').value,location:document.getElementById('place').value,qty:n,date:document.getElementById('date').value,note:document.getElementById('note').value.trim()};if(id)db.items[db.items.findIndex(x=>x.id===id)]=i;else db.items.push(i);loc=i.location;persist();closeM();toast(id?'已更新':'已新增')}function openLoc(){document.getElementById('locName').value='';document.getElementById('locModal').classList.add('show')}function closeLoc(){document.getElementById('locModal').classList.remove('show')}function addLoc(){let x=document.getElementById('locName').value.trim();if(!x)return toast('請輸入位置名稱');if(db.locations.includes(x))return toast('這個位置已存在');db.locations.push(x);loc=x;persist();closeLoc();toast('已新增「'+x+'」')}function openBuy(){document.getElementById('buyName').value='';document.getElementById('buyQty').value=1;document.getElementById('buyBrand').value='';document.getElementById('buyModal').classList.add('show')}function quickBuy(name){openBuy();document.getElementById('buyName').value=name}function closeBuy(){document.getElementById('buyModal').classList.remove('show')}function saveBuy(){let name=document.getElementById('buyName').value.trim();if(!name)return toast('請輸入品項');db.buys.push({name,qty:Math.max(1,Number(document.getElementById('buyQty').value)||1),brand:document.getElementById('buyBrand').value.trim()});persist();closeBuy();toast('已加入待買清單')}function removeBuy(k){db.buys.splice(k,1);persist();toast('已完成')}function changeTitle(){let x=prompt('輸入首頁標題',db.title||'防災物資');x=x?.trim();if(x){db.title=x;persist();toast('標題已更新')}}
function backup(share=false){let f=new File([JSON.stringify(db,null,2)],'防災物資備份.json',{type:'application/json'});if(share&&navigator.share&&navigator.canShare?.({files:[f]})){navigator.share({title:db.title,files:[f]}).catch(()=>{})}else download(f,f.name)}function excel(){let rows=[['物資名稱','類別','存放位置','數量','有效期限','備註'],...db.items.map(i=>[i.name,i.type,i.location,i.qty,i.date||'',i.note||''])];let html='\ufeff<meta charset="utf-8"><table border="1">'+rows.map(r=>'<tr>'+r.map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>').join('')+'</table>';download(new Blob([html],{type:'application/vnd.ms-excel;charset=utf-8'}),'防災物資.xlsx')}function download(b,name){let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),800)}function imp(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.items||!x.locations)throw 0;db=x;db.buys=db.buys||[];loc=db.locations[0]||'總物資';persist();toast('匯入完成')}catch(_){toast('備份檔格式不正確')}};r.readAsText(f);e.target.value=''}function toast(t){let x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1700)}render();
</script></body></html>
