lass="label">品項</label><input class="field" id="buyName" placeholder="例如：飲用水"><div class="two"><div><label class="label">數量</label><input class="field" id="buyQty" type="number" min="1" value="1"></div><div><label class="label">品牌</label><input class="field" id="buyBrand" placeholder="未指定"></div></div><div class="actions"><button class="btn" onclick="closeBuy()">取消</button><button class="btn primary" onclick="saveBuy()">加入待買</button></div></div></div><div id="toast" class="toast"></div><script>const KEY='disaster-supplies-v8',CATS=[['飲用水','blue','water'],['食品','orange','food'],['醫療用品','red','medical'],['照明工具','orange','light'],['保暖用品','green','warm'],['衛生用品','pink','hygiene'],['工具','gray','tool'],['嬰幼兒用品','orange','baby'],['其他用品','purple','other']];let db=load(),loc=db.locations[0]||'總物資',num=1;function load(){try{let x=JSON.parse(localStorage.getItem(KEY)||localStorage.getItem('disaster-supplies-v7')||localStorage.getItem('disaster-supplies-v6')||'');if(x?.items)return {...x,locations:x.locations?.length?x.locations:['總物資'],buys:x.buys||[]}}catch(e){}return{title:'防災物資',locations:['總物資','避難包'],items:[],buys:[]}}function persist(){localStorage.setItem(KEY,JSON.stringify(db));render()}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function days(d){return d?Math.ceil((new Date(d+'T23:59:59')-new Date())/86400000):9999}function icon(t){let p='viewBox="0 0 80 80"',a={water:`<svg ${p}><path d="M25 8h30l5 60H20z" fill="#d7edf1" stroke="#5f99a6" stroke-width="3"/><path d="M28 17h24M25 48q15-7 30 0v13H25z" stroke="#7cb0b9" stroke-width="3" fill="none"/></svg>`,food:`<svg ${p}><ellipse cx="40" cy="19" rx="23" ry="9" fill="#e8a24e" stroke="#9c7441" stroke-width="3"/><path d="M17 19v33q23 17 46 0V19" fill="#e3a14c" stroke="#9c7441" stroke-width="3"/><path d="M28 35h24" stroke="#fff3d6" stroke-width="4"/></svg>`,medical:`<svg ${p}><rect x="12" y="22" width="56" height="39" rx="9" fill="#eee2ce" stroke="#967d5e" stroke-width="3"/><path d="M28 22v-7q0-5 6-5h12q6 0 6 5v7" fill="none" stroke="#967d5e" stroke-width="3"/><path d="M40 31v20M30 41h20" stroke="#df6b54" stroke-width="5"/></svg>`,light:`<svg ${p}><path d="m17 55 34-36 12 12-35 35z" fill="#c9a77d" stroke="#7f705d" stroke-width="3"/><path d="m49 24 12 12M27 63l-9 9" stroke="#665e52" stroke-width="4"/></svg>`,warm:`<svg ${p}><path d="M16 22q12-8 24 0t24 0v38H16z" fill="#dfd0b0" stroke="#a28e68" stroke-width="3"/><path d="M20 34q12-8 24 0t16 0M20 47q12-8 24 0t16 0" fill="none" stroke="#b49d77" stroke-width="3"/></svg>`,hygiene:`<svg ${p}><path d="M26 10h28v58H26z" fill="#eee9df" stroke="#aaa49a" stroke-width="3"/><path d="M31 18h18M31 25h18M31 32h18M31 39h18M31 46h18M31 53h18" stroke="#bdb7ae" stroke-width="2"/></svg>`,tool:`<svg ${p}><path d="M19 20a15 15 0 0 0 18 20l23 23 7-7-23-23a15 15 0 0 0-20-19l10 10-8 8z" fill="#8e877c" stroke="#625e56" stroke-width="3"/></svg>`,baby:`<svg ${p}><path d="M27 20h26v43H27z" fill="#f3e4c6" stroke="#9a8364" stroke-width="3"/><path d="M30 20q10-11 20 0" fill="none" stroke="#9a8364" stroke-width="3"/><path d="M40 31v20M31 41h18" stroke="#d87a55" stroke-width="3"/></svg>`,other:`<svg ${p}><path d="M19 23h42v43H19z" fill="#87a5ad" stroke="#5d7379" stroke-width="3"/><path d="M28 23v-7q0-6 12-6t12 6v7" fill="none" stroke="#5d7379" stroke-width="3"/></svg>`};return a[t]||a.other}function typeIcon(n){return CATS.find(x=>x[0]===n)?.[2]||'other'}function render(){document.getElementById('title').textContent=db.title||'防災物資';renderLocs();let arr=loc==='總物資'?db.items:db.items.filter(i=>i.location===loc),soon=arr.filter(i=>days(i.date)>=0&&days(i.date)<=60).length;document.getElementById('cnt').textContent=arr.reduce((s,i)=>s+(+i.qty||0),0);document.getElementById('kinds').textContent=arr.length;document.getElementById('soon').textContent=soon;document.getElementById('low').textContent=db.buys.length;document.getElementById('cats').innerHTML=CATS.map(c=>{let q=arr.filter(i=>i.type===c[0]).reduce((s,i)=>s+(+i.qty||0),0);return `<div class="cat ${c[1]}" onclick="show('inventory');filterCat('${c[0]}')"><div class="pic">${icon(c[2])}</div><strong>${c[0]}</strong><small>${q} 件</small></div>`}).join('');let al=arr.filter(i=>days(i.date)<0||days(i.date)<=60||+i.qty<=1).slice(0,4);document.getElementById('homeAlerts').innerHTML=al.length?al.map(itemRow).join(''):'<div class="empty">目前沒有過期或缺少提醒</div>';document.getElementById('homeBuys').innerHTML=db.buys.slice(0,4).map(b=>`<div class="row"><div class="rowmain"><b>${esc(b.name)}</b></div><div>×${b.qty}</div><small>${esc(b.brand||'未指定品牌')}</small></div>`).join('')||'<div class="empty">目前沒有待買品項</div>';renderInventory();renderAlerts();document.getElementById('place').innerHTML=db.locations.map(x=>`<option>${esc(x)}</option>`).join('')}function renderLocs(){document.getElementById('homeLocs').innerHTML=db.locations.map(x=>`<button class="tab ${x===loc?'on':''}" onclick="setLoc('${esc(x)}')">${esc(x)}</button>`).join('')}function setLoc(x){loc=x;render()}function itemRow(i){let d=days(i.date),tag=d<0?'已過期':d<=60?'即將過期':(+i.qty<=1?'需補充':'充足'),cl=d<0?'danger':d<=60?'warn':'';return `<div class="row" onclick="detail('${i.id}')"><div class="pic">${icon(typeIcon(i.type))}</div><div class="rowmain"><b>${esc(i.name)}</b><small>數量：${i.qty} 件　效期：${i.date||'—'}</small></div><div class="rowright"><span class="tag ${cl}">${tag}</span></div></div>`}function renderInventory(){let q=(document.getElementById('search')?.value||'').toLowerCase(),arr=(loc==='總物資'?db.items:db.items.filter(i=>i.location===loc)).filter(i=>!q||i.name.toLowerCase().includes(q));document.getElementById('chips').innerHTML=['全部',...CATS.map(c=>c[0])].map(x=>`<button class="chip ${!q?'on':''}" onclick="filterCat('${x}')">${x}</button>`).join('');document.getElementById('list').innerHTML=arr.length?arr.map(itemRow).join(''):'<div class="empty">目前沒有物資資料</div>'}function filterCat(x){let s=document.getElementById('search');s.value=x==='全部'?'':x;renderInventory()}function renderAlerts(){let arr=db.items.filter(i=>days(i.date)<0||days(i.date)<=60||+i.qty<=1);document.getElementById('alertList').innerHTML=arr.length?arr.map(itemRow).join(''):'<div class="empty">✓ 目前沒有過期或缺少提醒</div>';document.getElementById('allBuys').innerHTML=db.buys.map((b,k)=>`<div class="row"><div class="rowmain"><b>${esc(b.name)}</b><small>${esc(b.brand||'未指定品牌')}</small></div><div>×${b.qty}</div><button class="smallbtn" onclick="removeBuy(${k})">完成</button></div>`).join('')||'<div class="empty">待買清單是空的</div>';let rec=CATS.map(x=>x[0]).filter(x=>!db.items.some(i=>i.type===x)&&!db.buys.some(b=>b.name===x));document.getElementById('recommendList').innerHTML=rec.map(x=>`<div class="row"><div class="pic">${icon(typeIcon(x))}</div><div class="rowmain"><b>${x}</b><small>建議列入避難包</small></div><button class="smallbtn" onclick="quickBuy('${x}')">加入待買</button></div>`).join('')||'<div class="empty">✓ 建議品項都已準備或列入待買</div>'}function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('active',x.id===id));document.querySelectorAll('.nav [data-s]').forEach(x=>x.classList.toggle('on',x.dataset.s===id));window.scrollTo(0,0);if(id==='add'){num=1;document.getElementById('num').textContent=1;document.getElementById('name').value='';document.getElementById('date').value='';document.getElementById('note').value='';document.getElementById('place').value=loc}}function chg(x){num=Math.max(1,num+x);document.getElementById('num').textContent=num}function save(){let name=document.getElementById('name').value.trim();if(!name)return toast('請輸入物資名稱');db.items.push({id:Date.now().toString(36),name,type:document.getElementById('type').value,location:document.getElementById('place').value,qty:num,date:document.getElementById('date').value,note:document.getElementById('note').value.trim()});loc=document.getElementById('place').value;persist();show('home');toast('已新增物資')}function detail(id){let i=db.items.find(x=>x.id===id);if(!i)return;document.getElementById('dp').innerHTML=icon(typeIcon(i.type));document.getElementById('dn').textContent=i.name;document.getElementById('dt').textContent=i.type;document.getElementById('dq').textContent=i.qty+' 件';document.getElementById('dd').textContent=i.date||'—';document.getElementById('dl').textContent=i.location;document.getElementById('dnote').textContent=i.note||'無';document.getElementById('used').onclick=()=>{i.qty=Math.max(0,i.qty-1);persist();detail(i.id);toast('已使用 1 件')};show('detail')}function openLoc(){document.getElementById('locName').value='';document.getElementById('locModal').classList.add('show')}function closeLoc(){document.getElementById('locModal').classList.remove('show')}function addLoc(){let x=document.getElementById('locName').value.trim();if(!x)return toast('請輸入位置名稱');if(db.locations.includes(x))return toast('這個位置已存在');db.locations.push(x);loc=x;persist();closeLoc();toast('已新增位置')}function openBuy(){document.getElementById('buyName').value='';document.getElementById('buyQty').value=1;document.getElementById('buyBrand').value='';document.getElementById('buyModal').classList.add('show')}function quickBuy(x){openBuy();document.getElementById('buyName').value=x}function closeBuy(){document.getElementById('buyModal').classList.remove('show')}function saveBuy(){let name=document.getElementById('buyName').value.trim();if(!name)return toast('請輸入品項');db.buys.push({name,qty:Math.max(1,+document.getElementById('buyQty').value||1),brand:document.getElementById('buyBrand').value.trim()});persist();closeBuy();toast('已加入待買清單')}function removeBuy(k){db.buys.splice(k,1);persist();toast('已完成')}function changeTitle(){let x=prompt('輸入首頁標題',db.title||'防災物資');if(x?.trim()){db.title=x.trim();persist()}}function backup(share=false){let f=new File([JSON.stringify(db,null,2)],'防災物資備份.json',{type:'application/json'});if(share&&navigator.share&&navigator.canShare?.({files:[f]}))navigator.share({title:db.title,files:[f]}).catch(()=>{});else download(f,f.name)}function excel(){let r=[['物資名稱','類別','存放位置','數量','有效期限','備註'],...db.items.map(i=>[i.name,i.type,i.location,i.qty,i.date||'',i.note||''])];download(new Blob(['\ufeff<meta charset="utf-8"><table>'+r.map(a=>'<tr>'+a.map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>').join('')+'</table>'],{type:'application/vnd.ms-excel'}),'防災物資.xlsx')}function download(b,n){let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),800)}function imp(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.items||!x.locations)throw 0;db={...x,buys:x.buys||[]};loc=db.locations[0]||'總物資';persist();toast('匯入完成')}catch(_){toast('備份檔格式不正確')}};r.readAsText(f);e.target.value=''}function toast(t){let x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1600)}render();</script></body></html>
