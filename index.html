<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f1e8"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="防災物資"><link rel="manifest" href="manifest.json"><title>防災物資</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f1e8;color:#39433d;font-family:"DFKai-SB","標楷體","Noto Serif TC",serif}.app{max-width:760px;margin:auto;padding-bottom:85px}.top{position:sticky;top:0;z-index:5;background:#f5f1e8ee;backdrop-filter:blur(12px);padding:15px 18px;border-bottom:1px solid #ded8ca}.brand{display:flex;justify-content:space-between;align-items:center}.brand h1{margin:0;font-size:25px;font-weight:600;letter-spacing:.08em}.brand small{font-family:system-ui;font-size:10px;color:#7a8179;letter-spacing:.15em}.content{padding:16px}.hero{padding:8px 4px 14px}.hero h2{margin:0 0 5px;font-size:22px}.hero p{margin:0;color:#7a8179;font-size:14px}.locations,.cats{display:flex;gap:8px;overflow:auto;padding:2px 0 13px}.pill{white-space:nowrap;padding:8px 14px;border:1px solid #ded8ca;border-radius:20px;background:#fffdf866;font-size:13px}.pill.active{background:#647565;color:#fff;border-color:#647565}.card{background:#fffdf8;border:1px solid #ded8ca;border-radius:18px;padding:15px;margin-bottom:12px;box-shadow:0 5px 18px #3f43390d}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{text-align:center;background:#f1eee5;border-radius:14px;padding:10px}.stat b{display:block;font:650 22px system-ui}.stat span{font-size:12px;color:#7a8179}.section{display:flex;justify-content:space-between;align-items:center;margin:18px 2px 9px}.section h3{margin:0;font-size:18px}.link{color:#647565}.item{display:flex;align-items:center;gap:12px;padding:12px 3px;border-bottom:1px dashed #ded8ca}.item:last-child{border:0}.icon{width:46px;height:46px;border-radius:14px;background:#eee9dc;display:grid;place-items:center;font-size:23px;flex:none}.main{flex:1;min-width:0}.name{font-size:17px}.meta{font:12px system-ui;color:#7a8179;margin-top:3px}.qty{font:650 16px system-ui}.badge{font-size:11px;border-radius:9px;padding:3px 6px;background:#f5e8cd;color:#986c25;margin-left:5px}.badge.red{background:#f4dfdc;color:#9d4f43}.screen{display:none}.screen.active{display:block}.toolbar{display:flex;gap:8px;margin-bottom:12px}.search,.select{width:100%;padding:11px;border:1px solid #ded8ca;border-radius:11px;background:#fffdf8;outline:0}.select{max-width:110px}.empty{text-align:center;padding:42px 10px;color:#7a8179}.fab{position:fixed;right:20px;bottom:76px;width:58px;height:58px;border:0;border-radius:50%;background:#647565;color:white;font-size:30px;box-shadow:0 8px 20px #4653473d}.nav{position:fixed;z-index:4;bottom:0;left:0;right:0;background:#fffdf8f5;border-top:1px solid #ded8ca;padding:6px 8px calc(6px + env(safe-area-inset-bottom));backdrop-filter:blur(14px)}.navin{max-width:760px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr)}.nav button{border:0;background:none;color:#7a8179;font-size:11px}.nav i{display:block;font-style:normal;font-size:21px}.nav .on{color:#647565;font-weight:bold}.modal{display:none;position:fixed;inset:0;background:#2c302b5c;z-index:20;align-items:flex-end}.modal.show{display:flex}.sheet{width:100%;max-width:760px;margin:auto;background:#fffdf8;border-radius:24px 24px 0 0;padding:16px 18px calc(20px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}.handle{width:42px;height:4px;border-radius:5px;background:#d2ccbf;margin:0 auto 14px}.sheet h2{margin:0 0 15px}.row{margin-bottom:12px}.row label{display:block;font-size:13px;color:#7a8179;margin-bottom:5px}.row input,.row select,.row textarea{width:100%;padding:11px;border:1px solid #ded8ca;border-radius:11px;background:#fff;outline:0}.row textarea{min-height:70px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.counter{display:flex;align-items:center;gap:12px}.counter button{width:40px;height:40px;border:0;border-radius:11px;background:#ebe7dc;font-size:22px}.counter strong{font:650 20px system-ui;min-width:30px;text-align:center}.actions{display:grid;grid-template-columns:1fr 2fr;gap:9px;margin-top:15px}.btn{padding:12px;border:1px solid #ded8ca;border-radius:11px;background:#f2eee5}.primary{background:#647565;color:#fff;border-color:#647565}.notice{padding:10px 12px;background:#f5e9d0;border-radius:11px;font-size:13px;color:#7f632e;margin-bottom:10px}.setting{display:flex;justify-content:space-between;align-items:center;padding:15px 2px;border-bottom:1px solid #ded8ca}.setting:last-child{border:0}.setting span{display:block;color:#7a8179;font-size:12px;margin-top:3px}.small{padding:8px 10px;border:1px solid #ded8ca;border-radius:9px;background:#f4f0e8}.toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);opacity:0;background:#39433d;color:#fff;padding:10px 16px;border-radius:11px;z-index:50;font-size:13px;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:430px){.two{grid-template-columns:1fr}.brand h1{font-size:23px}}</style></head><body><div class="app"><header class="top"><div class="brand"><div><h1>防災物資</h1><small>DISASTER SUPPLIES</small></div><button onclick="show('settings')" style="font-size:22px;color:#647565">⚙︎</button></div></header><main class="content"><section id="home" class="screen active"><div class="hero"><h2>家裡的物資，心裡有數。</h2><p>一眼知道放在哪裡、還剩多少、什麼時候該補。</p></div><div id="loc1" class="locations"></div><div class="card"><div class="summary"><div class="stat"><b id="cnt">0</b><span>品項</span></div><div class="stat"><b id="sum">0</b><span>總數量</span></div><div class="stat"><b id="exp">0</b><span>近期到期</span></div></div></div><div class="section"><h3>目前物資</h3><button class="link" onclick="show('inventory')">查看全部 →</button></div><div class="card" id="homeList"></div></section><section id="inventory" class="screen"><div class="hero"><h2>物資清單</h2><p>依位置、類別快速整理。</p></div><div id="loc2" class="locations"></div><div class="toolbar"><input id="search" class="search" placeholder="搜尋物資" oninput="render()"><select id="cat" class="select" onchange="render()"><option>全部</option><option>工具</option><option>耗材</option><option>醫療</option><option>食物</option></select></div><div class="card" id="list"></div></section><section id="alerts" class="screen"><div class="hero"><h2>補貨提醒</h2><p>快用完、快到期的物資會集中在這裡。</p></div><div class="card" id="alertList"></div><div class="section"><h3>備份與匯出</h3></div><div class="card"><div class="setting"><div><b>匯出 Excel</b><span>可用 Excel 開啟</span></div><button class="small" onclick="excel()">匯出</button></div><div class="setting"><div><b>備份 JSON</b><span>換手機時完整保留</span></div><button class="small" onclick="backup()">備份</button></div><div class="setting"><div><b>匯入 JSON</b><span>先預覽再覆蓋</span></div><button class="small" onclick="document.getElementById('file').click()">匯入</button></div></div><input id="file" type="file" accept=".json" hidden onchange="imp(event)"></section><section id="settings" class="screen"><div class="hero"><h2>設定</h2><p>資料保存在本機瀏覽器。</p></div><div class="card"><div class="setting"><div><b>管理存放位置</b><span>新增、改名、刪除位置</span></div><button class="small" onclick="locations()">管理</button></div><div class="setting"><div><b>分享備份</b><span>傳給家人或另一支手機</span></div><button class="small" onclick="backup(true)">分享</button></div><div class="setting"><div><b>清除全部資料</b><span>無法復原</span></div><button class="small" onclick="clearAll()">清除</button></div></div><div class="card"><div class="notice">iPhone 可用「加入主畫面」或「捷徑 → 打開 URL」啟動。資料不需要帳號。</div></div></section></main><button id="fab" class="fab" onclick="add()">＋</button><nav class="nav"><div class="navin"><button data-s="home" class="on" onclick="show('home')"><i>⌂</i>首頁</button><button data-s="inventory" onclick="show('inventory')"><i>▦</i>物資</button><button data-s="alerts" onclick="show('alerts')"><i>◷</i>提醒</button><button data-s="settings" onclick="show('settings')"><i>⚙</i>設定</button></div></nav></div><div id="modal" class="modal"><div class="sheet"><div class="handle"></div><h2 id="mt">新增物資</h2><input id="id" type="hidden"><div class="two"><div class="row"><label>物資名稱</label><input id="name" placeholder="例如：瓶裝水"></div><div class="row"><label>類別</label><select id="type"><option>工具</option><option>耗材</option><option>醫療</option><option>食物</option></select></div></div><div class="two"><div class="row"><label>存放位置</label><select id="place"></select></div><div class="row"><label>數量</label><div class="counter"><button onclick="change(-1)">−</button><strong id="number">1</strong><button onclick="change(1)">＋</button></div></div></div><div class="row"><label>有效期限</label><input id="date" type="date"></div><div class="row"><label>備註</label><textarea id="note" placeholder="品牌、規格、放置細節……"></textarea></div><div class="actions"><button class="btn" onclick="closeM()">取消</button><button class="btn primary" onclick="save()">儲存</button></div></div></div><div id="toast" class="toast"></div><script>const K='disaster-supplies-v2';let db=JSON.parse(localStorage.getItem(K)||'{"locations":["總物資"],"items":[]}'),loc=db.locations[0],n=1;const saveDB=()=>{localStorage.setItem(K,JSON.stringify(db));render()};const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[c]));const days=d=>d?Math.ceil((new Date(d+'T23:59:59')-new Date())/864e5):99999;const ico=c=>({工具:'🛠️',耗材:'🧻',醫療:'🩹',食物:'🥫'}[c]||'📦');function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('active',x.id===id));document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('on',x.dataset.s===id));document.getElementById('fab').style.display=id==='home'||id==='inventory'?'block':'none';render()}function pills(id){document.getElementById(id).innerHTML=db.locations.map(x=>`<button class="pill ${x===loc?'active':''}" onclick="loc='${esc(x)}';render()">${esc(x)}</button>`).join('')}function item(i){let d=days(i.date),b=i.date?(d<0?'<span class="badge red">已過期</span>':d<=60?`<span class="badge">${d===0?'今天':d+'天後'}</span>`:''):'';return `<div class="item" onclick="edit('${i.id}')"><div class="icon">${ico(i.type)}</div><div class="main"><div class="name">${esc(i.name)} ${b}</div><div class="meta">${esc(i.type)} · ${esc(i.location)}${i.date?' · '+esc(i.date):''}${i.note?' · '+esc(i.note):''}</div></div><div class="qty">${i.qty}</div></div>`}function render(){pills('loc1');pills('loc2');document.getElementById('place').innerHTML=db.locations.map(x=>`<option>${esc(x)}</option>`).join('');let q=(document.getElementById('search')?.value||'').toLowerCase(),c=document.getElementById('cat')?.value||'全部',arr=db.items.filter(i=>i.location===loc&&(c==='全部'||i.type===c)&&(!q||i.name.toLowerCase().includes(q)));document.getElementById('list').innerHTML=arr.length?arr.map(item).join(''):'<div class="empty">📦<br>目前沒有符合的物資</div>';let home=db.items.filter(i=>i.location===loc),soon=db.items.filter(i=>days(i.date)<=60);document.getElementById('homeList').innerHTML=home.length?home.slice(0,8).map(item).join(''):'<div class="empty">🧺<br>這裡還沒有物資</div>';document.getElementById('cnt').textContent=home.length;document.getElementById('sum').textContent=home.reduce((a,i)=>a+i.qty,0);document.getElementById('exp').textContent=soon.length;let low=db.items.filter(i=>i.qty<=1),ex=db.items.filter(i=>days(i.date)<=60);document.getElementById('alertList').innerHTML=low.length||ex.length?`<div class="notice">數量偏低：${low.length} 項　｜　60 天內到期：${ex.length} 項</div>${[...new Map([...low,...ex].map(i=>[i.id,i])).values()].map(item).join('')}`:'<div class="empty">🌿<br>目前沒有需要處理的提醒</div>'}function add(){document.getElementById('mt').textContent='新增物資';document.getElementById('id').value='';document.getElementById('name').value='';document.getElementById('type').value='食物';document.getElementById('place').value=loc;document.getElementById('date').value='';document.getElementById('note').value='';n=1;document.getElementById('number').textContent=n;document.getElementById('modal').classList.add('show')}function edit(id){let i=db.items.find(x=>x.id===id);if(!i)return;document.getElementById('mt').textContent='編輯物資';document.getElementById('id').value=id;document.getElementById('name').value=i.name;document.getElementById('type').value=i.type;document.getElementById('place').value=i.location;document.getElementById('date').value=i.date||'';document.getElementById('note').value=i.note||'';n=i.qty;document.getElementById('number').textContent=n;document.getElementById('modal').classList.add('show')}function closeM(){document.getElementById('modal').classList.remove('show')}function change(x){n=Math.max(0,Math.min(999,n+x));document.getElementById('number').textContent=n}function save(){let name=document.getElementById('name').value.trim();if(!name)return toast('請輸入物資名稱');let id=document.getElementById('id').value,i={id:id||Date.now().toString(36),name,type:document.getElementById('type').value,location:document.getElementById('place').value,qty:n,date:document.getElementById('date').value,note:document.getElementById('note').value.trim()};if(id)db.items[db.items.findIndex(x=>x.id===id)]=i;else db.items.push(i);loc=i.location;saveDB();closeM();toast(id?'已更新':'已新增')}function backup(share=false){let f=new File([JSON.stringify(db,null,2)],'防災物資備份.json',{type:'application/json'});if(share&&navigator.share&&navigator.canShare?.({files:[f]}))navigator.share({title:'防災物資備份',files:[f]}).catch(()=>{});else download(f,f.name)}function excel(){let rows=[['物資名稱','類別','存放位置','數量','有效期限','備註'],...db.items.map(i=>[i.name,i.type,i.location,i.qty,i.date||'',i.note||''])];let html='<meta charset="utf-8"><table border="1">'+rows.map(r=>'<tr>'+r.map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>').join('')+'</table>';download(new Blob([html],{type:'application/vnd.ms-excel'}),'防災物資.xlsx')}function download(b,name){let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}function imp(e){let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.items||!x.locations)throw 0;if(confirm(`匯入 ${x.items.length} 項物資並覆蓋目前資料？`)){db=x;loc=db.locations[0];saveDB();toast('匯入完成')}}catch(_){toast('備份檔格式不正確')}};r.readAsText(e.target.files[0]);e.target.value=''}function locations(){let a=prompt('輸入：新增／改名／刪除');if(a==='新增'){let x=prompt('新位置');if(x&&!db.locations.includes(x))db.locations.push(x)}else if(a==='改名'){let o=prompt('原位置',loc),x=prompt('新名稱');if(o&&x&&db.locations.includes(o)){db.locations[db.locations.indexOf(o)]=x;db.items.forEach(i=>{if(i.location===o)i.location=x});loc=x}}else if(a==='刪除'&&db.locations.length>1){let o=prompt('要刪除的位置',loc),d=db.locations.find(x=>x!==o);db.items.forEach(i=>{if(i.location===o)i.location=d});db.locations=db.locations.filter(x=>x!==o);loc=d}else return toast('請輸入正確動作');saveDB();toast('位置已更新')}function clearAll(){if(confirm('確定清除全部物資？')){db={locations:['總物資'],items:[]};loc='總物資';saveDB();toast('已清除')}}function toast(t){let x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1700)}render();</script></body></html>
